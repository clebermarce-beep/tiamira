<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0056b3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Tia Mira">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Tia Mira Transportes - Transporte Escolar</title>
    <style>
        :root {
            --primary-blue: #0056b3;
            --success-green: #28a745;
            --dark-gray: #333;
            --danger-red: #dc3545;
            --warning-orange: #fd7e14;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            background-color: #f0f2f5; color: var(--dark-gray);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        header { background: white; width: 100%; text-align: center; padding: 12px 0; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
        .header-title { font-size: 22px; font-weight: bold; color: var(--primary-blue); margin: 0; }
        .brand-logo { height: 120px; width: auto; display: inline-block; margin-bottom: 2px; }
        .header-sub { font-size: 12px; color: #888; margin: 0; }
        .container { width: 95%; max-width: 540px; margin: 15px 0; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,.05); }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 15px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-add { background: var(--primary-blue); color: white; }
        .btn-success { background: var(--success-green); color: white; }
        .btn-danger { background: var(--danger-red); color: white; }
        .btn-warn { background: var(--warning-orange); color: white; }
        .btn-outline { background: white; color: var(--primary-blue); border: 2px solid var(--primary-blue); }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
        .tab { flex: 1; min-width: 90px; padding: 12px; text-align: center; border: 2px solid var(--primary-blue); border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 13px; background: white; color: var(--primary-blue); }
        .tab.active { background: var(--primary-blue); color: white; }
        .item { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 15px; margin-bottom: 10px; }
        .item-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
        .item-name { font-weight: bold; font-size: 15px; }
        .item-value { font-weight: bold; font-size: 15px; color: var(--primary-blue); }
        .item-small { font-size: 12px; color: #666; margin-top: 4px; }
        .badge { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: 11px; font-weight: bold; color: white; white-space: nowrap; }
        .b-pendente { background: var(--warning-orange); }
        .b-aprovado { background: var(--success-green); }
        .b-reprovado { background: var(--danger-red); }
        .b-ativo { background: var(--success-green); }
        .b-aguardando { background: var(--warning-orange); }
        .b-vencido { background: var(--danger-red); }
        .b-cancelado { background: #6c757d; }
        .notice { background: #fff3cd; border: 1px solid #ffecb5; color: #664d03; padding: 12px; border-radius: 12px; font-size: 14px; margin-bottom: 12px; }
        .ok { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; padding: 12px; border-radius: 12px; font-size: 14px; margin-bottom: 12px; }
        .mini-btn { border: none; cursor: pointer; font-size: 12px; font-weight: bold; padding: 7px 12px; border-radius: 8px; color: white; }
        .mb-add { background: var(--primary-blue); }
        .mb-ok { background: var(--success-green); }
        .mb-danger { background: var(--danger-red); }
        .mb-warn { background: var(--warning-orange); }
        .grid2 { display: flex; gap: 10px; flex-wrap: wrap; }
        .grid2 > * { flex: 1; min-width: 120px; }
        .stat-card { background: var(--primary-blue); color: white; border-radius: 15px; padding: 14px; text-align: center; flex: 1; min-width: 110px; }
        .stat-card h3 { margin: 0; font-size: 22px; color: white; }
        .stat-card p { margin: 4px 0 0; font-size: 12px; opacity: .9; }
        .fake-map { width: 100%; height: 180px; border-radius: 15px; border: 1px solid #ddd; background: linear-gradient(160deg, #e8f0fe 0%, #d9f2e6 60%, #fff3cd 100%); position: relative; overflow: hidden; }
        .fake-map .pin { position: absolute; font-size: 26px; transform: translate(-50%,-50%); transition: left .8s, top .8s; }
        .fake-map .label-pin { position: absolute; transform: translate(-50%,-100%); background: white; border-radius: 8px; padding: 2px 6px; font-size: 11px; font-weight: bold; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
        .float-info { position: absolute; bottom: 8px; left: 8px; right: 8px; background: rgba(255,255,255,.95); border-radius: 10px; padding: 8px; font-size: 12px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; }
        .hidden { display: none; }
        .link { color: var(--primary-blue); cursor: pointer; font-weight: bold; text-decoration: underline; }
        .aviso-topo { background: #e7f3ff; color: #0056b3; padding: 10px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; }
        hr { border: none; border-top: 1px dashed #ddd; margin: 14px 0; }
        h2, h3 { color: var(--primary-blue); }
        .rota-tag { background: #e7f3ff; color: #0056b3; border-radius: 10px; padding: 4px 8px; font-size: 12px; font-weight: bold; }
        .parada-list { list-style: none; padding: 0; margin: 8px 0; }
        .parada-list li { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #eee; font-size: 13px; }
        .parada-num { background: var(--primary-blue); color: white; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; flex-shrink: 0; }
        .presenca { display: flex; gap: 6px; margin-top: 6px; }
        .presenca button { flex: 1; }
        .fin-hero { border-radius: 18px; padding: 18px; color: white; text-align: center; margin-bottom: 12px; }
        .fin-hero h3 { margin: 0; font-size: 30px; color: inherit; }
        .fin-hero p { margin: 4px 0 0; font-size: 13px; opacity: .92; }
        .fin-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
        .fin-card { flex: 1; min-width: 130px; background: #fff; border: 1px solid #eee; border-radius: 14px; padding: 12px; }
        .fin-card .t { font-size: 12px; color: #888; }
        .fin-card .v { font-size: 18px; font-weight: bold; margin-top: 4px; color: #333; }
        .fin-card .v.g { color: var(--success-green); }
        .fin-card .v.o { color: var(--warning-orange); }
        .fin-card .v.r { color: var(--danger-red); }
        .exp-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .exp-cat { font-size: 11px; color: #888; }
        .resumo-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
        .resumo-item:last-child { border-bottom: none; }
        .quinzena-title { font-size: 16px; font-weight: bold; color: var(--primary-blue); margin: 18px 0 10px; padding-bottom: 5px; border-bottom: 2px solid var(--primary-blue); }
        .empty-msg { color: #999; font-size: 13px; }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="Tia Mira Transportes" class="brand-logo">
        <p class="header-sub">Transporte escolar agendado · Acesso exclusivo</p>
        <div id="headerUser" class="header-sub"></div>
    </header>
    <div id="app" class="container"></div>

    <!-- Tela de bloqueio por PIN -->
    <div id="pinOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
         background:rgba(0,0,0,0.9); z-index:2000; flex-direction:column; align-items:center; justify-content:center;">
        <div style="background:white; padding:30px; border-radius:20px; text-align:center; width:90%; max-width:320px; box-sizing:border-box;">
            <h3 style="color:#0056b3; margin:0 0 5px;">Tia Mira 🔒</h3>
            <p style="color:#888; font-size:13px; margin:0 0 15px;">Digite seu PIN de 4 d\u00edgitos</p>
            <input type="password" id="pinInput" maxlength="4" inputmode="numeric" pattern="[0-9]*"
                   placeholder="****" style="text-align:center; font-size:24px; letter-spacing:12px;"
                   onkeydown="if(event.key==='Enter')verificarPin()">
            <div id="pinErro" style="color:#dc3545; font-size:13px; min-height:18px; margin-top:5px;"></div>
            <button class="btn btn-add" onclick="verificarPin()">ENTRAR</button>
            <p style="font-size:11px; color:#bbb; margin-top:10px;">Altere ou remova o PIN no perfil Administrativo.</p>
        </div>
    </div>

    <script>
        // ============================================================
        // Tia Mira Transportes - MVP PWA (demo com localStorage)
        // Fluxo: cadastro pelo administrativo -> cadastrar aluno -> contratar rota
        //        -> pagar -> roteiro motorista -> GPS -> presença -> finalizar
        // ============================================================

        const LS_KEY = 'tiamira_db_v1';

        const seed = {
            users: [
                { id:'u_admin', nome:'Admin Tia Mira', email:'zemirafaustino@gmail.com', senha:'', tipo:'admin', status:'aprovado' }
            ],
            students: [],
            schools: [],
            drivers: [],
            vehicles: [],
            routes: [],
            route_stops: [],
            contracts: [],
            enrollments: [],
            trips: [],
            payments: [],
            expenses: [],
            revenues: [],
            trip_active: null
        };

        let db = load();
        function load() {
            try {
                const raw = localStorage.getItem(LS_KEY);
                if (raw) {
                    const d = JSON.parse(raw);
                    if (!d.expenses) d.expenses = [];
                    if (!d.revenues) d.revenues = [];
                    if (Array.isArray(d.contracts)) d.contracts.forEach(c => { if (c.pago === undefined) c.pago = !!c.paid_at; });
                    if (!d._exemplosRemovidos) {
                        const EX = { users:['u_resp','u_resp2','u_pend','u_mot','u_mot2'],
                                     students:['s1','s2','s3'],
                                     schools:['e1','e2'],
                                     drivers:['d1','d2'],
                                     vehicles:['v1','v2'],
                                     routes:['rta','rtb'],
                                     route_stops:['p1','p2','p3','p4','p5'],
                                     contracts:['c1','c2'],
                                     enrollments:['en1','en2'] };
                        Object.keys(EX).forEach(k => { if (Array.isArray(d[k])) d[k] = d[k].filter(x => !EX[k].includes(x.id)); });
                        if (Array.isArray(d.enrollments)) d.enrollments = d.enrollments.filter(e => !EX.routes.includes(e.route_id) && !EX.contracts.includes(e.contract_id) && !EX.students.includes(e.student_id));
                        d._exemplosRemovidos = true;
                    }
                    if (Array.isArray(d.users)) {
                        d.users.forEach(u => {
                            if (u.email && u.email.toLowerCase() === 'admin@tiamira.com.br') { u.email = 'zemirafaustino@gmail.com'; u.senha = ''; }
                        });
                    }
                    // limpeza de registros órfãos (usuário/aluno/rota removidos)
                    if (Array.isArray(d.users)) {
                        const uids = d.users.map(u=>u.id);
                        const rids = (d.routes||[]).map(r=>r.id);
                        d.students = (d.students||[]).filter(s => uids.includes(s.responsavel_id));
                        const sids = d.students.map(s=>s.id);
                        d.contracts = (d.contracts||[]).filter(c => sids.includes(c.student_id) && rids.includes(c.route_id));
                        const cids = d.contracts.map(c=>c.id);
                        d.enrollments = (d.enrollments||[]).filter(e => cids.includes(e.contract_id));
                        d.route_stops = (d.route_stops||[]).filter(p => rids.includes(p.route_id));
                        d.drivers = (d.drivers||[]).filter(dr => uids.includes(dr.user_id));
                    }
                    return d;
                }
            } catch(e){}
            return JSON.parse(JSON.stringify(seed));
        }
        function save() { localStorage.setItem(LS_KEY, JSON.stringify(db)); }
        function resetDB() { db = JSON.parse(JSON.stringify(seed)); save(); render(); }

        let sessao = { user_id: null };
        function userAtual() { return db.users.find(u => u.id === sessao.user_id) || null; }

        function pad(n){ return String(n).padStart(2,'0'); }
        function agora() { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
        function hoje() { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
        function money(v) { return 'R$ '+Number(v).toFixed(2).replace('.',','); }
        function statusBadge(s) {
            const map = { pendente:'b-pendente', pendente_pagamento:'b-aguardando', aprovado:'b-aprovado', ativo:'b-ativo', vencido:'b-vencido', cancelado:'b-cancelado', reprovado:'b-reprovado', agendado:'b-aguardando', iniciado:'b-aguardando', em_andamento:'b-aguardando', finalizado:'b-ativo', pago:'b-ativo' };
            const label = { pendente:'Pendente', pendente_pagamento:'Aguardando pagamento', aprovado:'Aprovado', ativo:'Ativo', vencido:'Vencido', cancelado:'Cancelado', reprovado:'Reprovado', agendado:'Agendado', iniciado:'Iniciado', em_andamento:'Em andamento', finalizado:'Finalizado', pago:'Pago' };
            return '<span class="badge '+(map[s]||'')+'">'+(label[s]||s)+'</span>';
        }
        function userNome(uid) { const u = db.users.find(x=>x.id===uid); return u ? u.nome : '-'; }
        function schoolNome(sid) { const s = db.schools.find(x=>x.id===sid); return s ? s.nome : '-'; }
        function studentNome(sid) { const s = db.students.find(x=>x.id===sid); return s ? s.nome : '-'; }
        function routeNome(rid) { const r = db.routes.find(x=>x.id===rid); return r ? r.nome : '-'; }

        // ================= LOGIN =================
        function loginView() {
            return `
                <div class="notice"><b>Tia Mira Transportes</b> tem acesso exclusivo. Os cadastros s\u00e3o realizados pelo administrativo. Contate a equipe para liberar seu acesso.</div>
                <h3>Acessar plataforma</h3>
                <div class="form-group"><label>E-mail</label><input id="loginEmail" type="email" value="zemirafaustino@gmail.com"></div>
                <div class="form-group"><label>Senha</label><input id="loginSenha" type="password" value="" placeholder="No primeiro acesso, digite a senha que deseja criar"></div>
                <button class="btn btn-add" onclick="doLogin()">Entrar</button>
            `;
        }
        function doLogin() {
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const senha = document.getElementById('loginSenha').value;
            const u = db.users.find(x => x.email.toLowerCase() === email);
            if (!u) { alert('E-mail ou senha inv\u00e1lidos.'); return; }
            if (!u.senha) {
                if (!senha || senha.length < 3) { alert('Primeiro acesso: digite a senha que voc\u00ea deseja criar (m\u00edn. 3 caracteres) e clique em Entrar. Ela ficar\u00e1 salva.'); return; }
                u.senha = senha; save();
                alert('Senha criada com sucesso! Guarde-a para os pr\u00f3ximos acessos.');
            } else if (u.senha !== senha) {
                alert('E-mail ou senha inv\u00e1lidos.'); return;
            }
            if (u.status !== 'aprovado') { alert('Seu cadastro est\u00e1 em an\u00e1lise. Aguarde a aprova\u00e7\u00e3o.'); return; }
            sessao.user_id = u.id; save(); render();
        }
        function demoLogin(tipo) {
            const u = db.users.find(x => x.tipo === tipo && x.status === 'aprovado');
            if (!u) { alert('Nenhum usu\u00e1rio dispon\u00edvel para esse perfil.'); return; }
            sessao.user_id = u.id; render();
        }
        function logout() { sessao.user_id = null; db.trip_active = null; save(); render(); }

        

        // ================= RESPONSÁVEL =================
        function responsavelView(u) {
            const alunos = db.students.filter(s => s.responsavel_id === u.id);
            const contratos = db.contracts.filter(c => c.responsavel_id === u.id);
            return `
                <div class="aviso-topo">Ol\u00e1, <b>${u.nome.split(' ')[0]}</b>! Gerencie seus filhos, rotas e mensalidades.</div>
                <div class="tabs">
                    <div class="tab active" id="r1" onclick="abaResp('home')">Home</div>
                    <div class="tab" id="r2" onclick="abaResp('alunos')">Meus Alunos</div>
                    <div class="tab" id="r3" onclick="abaResp('rotas')">Rotas Dispon\u00edveis</div>
                    <div class="tab" id="r4" onclick="abaResp('contratacoes')">Contrata\u00e7\u00f5es</div>
                    <div class="tab" id="r5" onclick="logout()">Sair</div>
                </div>
                <div id="respContent">${respHome(u)}</div>
            `;
        }
        function abaResp(nome) {
            const u = userAtual(); if (!u) return;
            ['r1','r2','r3','r4'].forEach(id=>{ const el=document.getElementById(id); el&&el.classList.remove('active'); });
            const map = { home:'r1', alunos:'r2', rotas:'r3', contratacoes:'r4' };
            const at = document.getElementById(map[nome]); if (at) at.classList.add('active');
            let html='';
            if (nome==='home') html = respHome(u);
            if (nome==='alunos') html = respAlunos(u);
            if (nome==='rotas') html = respRotas(u);
            if (nome==='contratacoes') html = respContratacoes(u);
            document.getElementById('respContent').innerHTML = html;
        }
        function respHome(u) {
            const alunos = db.students.filter(s=>s.responsavel_id===u.id);
            const ativos = db.contracts.filter(c=>c.responsavel_id===u.id && c.status==='ativo');
            const contratoAtivoIds = ativos.map(c=>c.id);
            const tripResp = db.trips.filter(t => t.status==='em_andamento' && (t.students||[]).some(st => {
                const en = db.enrollments.find(e=>e.id===st.enrollment_id);
                return en && contratoAtivoIds.includes(en.contract_id);
            }))[0];
            return `
                <div class="stat-card"><h3>${alunos.length}</h3><p>Meus alunos</p></div>
                <div class="stat-card" style="background:#28a745;"><h3>${ativos.length}</h3><p>Contratos ativos</p></div>
                <hr>
                <h3>Acompanhar hoje</h3>
                ${tripResp ? '<button class="btn btn-success" onclick="responsavelAcompanhar()">Acompanhar viagem em tempo real</button>' : '<p>Aguardando in\u00edcio da viagem. Quando o motorista iniciar, o bot\u00e3o aparecer\u00e1 aqui.</p>'}
            `;
        }
        function respAlunos(u) {
            const alunos = db.students.filter(s=>s.responsavel_id===u.id);
            let html = `<h3>Meus Alunos</h3><button class="btn btn-add" onclick="formAluno('${u.id}')">Adicionar aluno</button><hr id="formAlunoSlot"></hr>`;
            if (!alunos.length) html += '<p>Nenhum aluno cadastrado ainda.</p>';
            html += alunos.map(s=>`
                <div class="item">
                    <div class="item-header"><span class="item-name">${s.nome}</span>${statusBadge(s.ativo?'ativo':'cancelado')}</div>
                    <div class="item-small">${schoolNome(s.escola_id)} \u00b7 ${s.serie||'-'} \u00b7 Nasc: ${s.nascimento}</div>
                    ${s.necessidades ? '<div class="item-small" style="color:#dc3545;">Necessidade: '+s.necessidades+'</div>':''}
                </div>`).join('');
            return html;
        }
        function formAluno(rid) {
            const opts = db.schools.map(sc=>`<option value="${sc.id}">${sc.nome}</option>`).join('');
            document.getElementById('formAlunoSlot').innerHTML = `
                <div class="item">
                    <h3 style="margin-top:0;">Novo aluno</h3>
                    <div class="form-group"><label>Nome completo</label><input id="alNome"></div>
                    <div class="grid2">
                        <div class="form-group"><label>Data de nascimento</label><input id="alNasc" type="date"></div>
                        <div class="form-group"><label>S\u00e9rie/Turma</label><input id="alSerie"></div>
                    </div>
                    <div class="form-group"><label>Escola</label><select id="alEscola">${opts}</select></div>
                    <div class="form-group"><label>Necessidades especiais (ex: cadeirinha)</label><input id="alNecess" placeholder="Opcional"></div>
                    <div class="form-group"><label>Observa\u00e7\u00f5es</label><input id="alObs"></div>
                    <button class="btn btn-success" onclick="salvarAluno('${rid}')">Salvar aluno</button>
                </div>`;
        }
        function salvarAluno(rid) {
            const nome = document.getElementById('alNome').value.trim();
            if (!nome) { alert('Informe o nome do aluno.'); return; }
            db.students.push({
                id:'s_'+Date.now(), responsavel_id:rid, nome,
                nascimento:document.getElementById('alNasc').value,
                serie:document.getElementById('alSerie').value.trim(),
                escola_id:document.getElementById('alEscola').value,
                necessidades:document.getElementById('alNecess').value.trim(),
                observacoes:document.getElementById('alObs').value.trim(), ativo:true
            });
            save(); render();
        }
        function respRotas(u) {
            const rotasAtivas = db.routes.filter(r=>r.ativo);
            return `
                <h3>Rotas Dispon\u00edveis</h3>
                <div class="notice">Filtros reais no app final: Escola, Bairro, Turno, Vagas restantes. Aqui listamos as rotas ativas.</div>
                ${rotasAtivas.map(r=>{
                    const v = db.vehicles.find(vv=>vv.id===r.vehicle_id);
                    const d = db.drivers.find(dd=>dd.id===r.driver_id);
                    const mot = d ? userNome(d.user_id) : '-';
                    const ocup = db.enrollments.filter(e=>e.route_id===r.id && e.ativo).length;
                    const vagas = (v?v.capacidade:0) - ocup;
                    const stops = db.route_stops.filter(st=>st.route_id===r.id).sort((a,b)=>a.ordem-b.ordem);
                    return `<div class="item">
                        <div class="item-header"><span class="item-name">${r.nome}</span><span class="rota-tag">${vagas>0?vagas+' vaga(s)':'Lota\u00e7\u00e3o cheia'}</span></div>

                        <div class="item-small">Motorista: ${mot} \u00b7 ${v? v.modelo+' ('+v.placa+', cap. '+v.capacidade+')':''} \u00b7 Mensal ${money(r.valor_mensal)}/aluno</div>

        function verParadas(rid) {
            const stops = db.route_stops.filter(st=>st.route_id===rid).sort((a,b)=>a.ordem-b.ordem);
            const el = document.getElementById('stops'+rid);
            el.innerHTML = '<ul class="parada-list">' + stops.map(s=>`<li><span class="parada-num">${s.ordem}</span><div><b>${s.endereco}</b><br><span style="font-size:11px;">${s.tipo==='escola'?'Escola':s.tipo} \u00b7 ${s.bairro}</span></div></li>`).join('') + '</ul>';
            el.classList.toggle('hidden');
        }
        function formContratar(rid) {
            const u = userAtual();
            const alunos = db.students.filter(s=>s.responsavel_id===u.id && s.ativo);
            if (!alunos.length) { alert('Cadastre um aluno primeiro.'); abaResp('alunos'); return; }
            const r = db.routes.find(x=>x.id===rid);
            const optsA = alunos.map(a=>`<option value="${a.id}">${a.nome}</option>`).join('');
            document.getElementById('app').innerHTML = `
                <h3>Contratar rota: ${r.nome}</h3>
                <div class="form-group"><label>Aluno</label><select id="ctAluno">${optsA}</select></div>
                <div class="form-group"><label>Turno</label><select id="ctTurno"><option value="ida_volta">Ida + Volta (${money(r.valor_mensal)})</option><option value="ida">Somente Ida (${money(Math.round(r.valor_mensal*0.8))})</option><option value="volta">Somente Volta (${money(Math.round(r.valor_mensal*0.8))})</option></select></div>
                <div class="notice">Valor mensal por aluno. Ap\u00f3s o pagamento via link PIX/Cart\u00e3o, o aluno entra no roteiro do motorista.</div>
                <button class="btn btn-add" onclick="confirmarContrato('${rid}')">Gerar contrato + link de pagamento</button>
                <button class="btn btn-outline" onclick="render()">Voltar</button>`;
        }
        function confirmarContrato(rid) {
            const u = userAtual(); if (!u) return;
            const sid = document.getElementById('ctAluno').value;
            const turno = document.getElementById('ctTurno').value;
            const r = db.routes.find(x=>x.id===rid);
            const valor = turno==='ida_volta' ? r.valor_mensal : Math.round(r.valor_mensal*0.8);
            // controle de vagas no momento da contratação
            const v = db.vehicles.find(vv=>vv.id===r.vehicle_id);
            const ocup = db.enrollments.filter(e=>e.route_id===rid && e.ativo).length;
            if (v && ocup >= v.capacidade) { alert('Lota\u00e7\u00e3o atingida. N\u00e3o \u00e9 poss\u00edvel contratar.'); return; }
            // evita duplicidade do mesmo aluno na mesma rota+turno
            const dup = db.contracts.some(c => c.responsavel_id===u.id && c.student_id===sid && c.route_id===rid && c.status!=='cancelado');
            if (dup) { alert('Este aluno j\u00e1 possui contrato nesta rota.'); return; }
            const c = {
                id:'c_'+Date.now(), responsavel_id:u.id, student_id:sid, route_id:rid,
                turno, valor_mensal:valor, status:'pendente_pagamento', vencimento_dia:5
            };
            db.contracts.push(c);
            const link = { id:'l_'+Date.now(), contract_id:c.id, descricao:'Mensalidade '+r.nome.split(' -> ')[0]+' - '+studentNome(sid), valor, forma:'PIX/cart\u00e3o', status:'pendente', link_url:'https://pay.mock.br/'+Date.now(), gerado_em:agora() };
            if (!db.payments) db.payments = [];
            db.payments.push(link);
            save();
            document.getElementById('app').innerHTML = `
                <div class="ok"><b>Contrato gerado - Aguardando pagamento</b></div>
                <div class="item"><div class="item-name">${link.descricao}</div><div class="item-value">${money(valor)}</div>
                <div class="item-small">Link: ${link.link_url}</div></div>
                <button class="btn btn-success" onclick="pagarContrato('${c.id}')">Pagar agora (simular PIX/cart\u00e3o)</button>
                <button class="btn btn-outline" onclick="render()">Voltar</button>`;
        }
        function pagarContrato(cid) {
            const c = db.contracts.find(x=>x.id===cid); if (!c) return;
            c.status = 'ativo'; c.paid_at = agora(); c.data_ativacao = agora();
            const pay = (db.payments||[]).find(p=>p.contract_id===cid);
            if (pay) { pay.status='pago'; pay.pago_em=agora(); }
            // gera enrollments
            const shifts = c.turno==='ida_volta' ? ['ida','volta'] : [c.turno];
            shifts.forEach(sh => db.enrollments.push({ id:'en_'+Date.now()+sh, contract_id:c.id, route_id:c.route_id, student_id:c.student_id, shift:sh, ativo:true }));
            save();
            alert('Pagamento confirmado via webhook simulado. Aluno inclu\u00eddo no roteiro do motorista!');
            render();
        }
        function respContratacoes(u) {
            const contratos = db.contracts.filter(c=>c.responsavel_id===u.id);
            if (!contratos.length) return '<p>Voc\u00ea ainda n\u00e3o tem contrata\u00e7\u00f5es. V\u00e1 em "Rotas Dispon\u00edveis".</p>';
            return contratos.map(c=>{
                const pay = (db.payments||[]).find(p=>p.contract_id===c.id);
                return `<div class="item">
                    <div class="item-header"><span class="item-name">${routeNome(c.route_id)}</span>${statusBadge(c.status)}</div>
                    <div class="item-small">Aluno: ${studentNome(c.student_id)} \u00b7 Turno: ${c.turno.replace('_',' + ')} \u00b7 ${money(c.valor_mensal)}/m\u00eas</div>
                    ${pay && c.status==='pendente_pagamento' ? '<button class="btn btn-warn" onclick="pagarContrato(\''+c.id+'\')">Pagar mensalidade (link PIX/cart\u00e3o)</button>' : ''}
                    ${guestInfo(c)}
                </div>`;
            }).join('');
        }

        // ================= ACOMPANHAR (RESPONSÁVEL) =================
        function responsavelAcompanhar() {
            const u = userAtual(); if (!u) return;
            const t = db.trips.find(tr => tr.status==='em_andamento' && (tr.students||[]).some(st => {
                const en = db.enrollments.find(e=>e.id===st.enrollment_id);
                const c = en ? db.contracts.find(cc=>cc.id===en.contract_id) : null;
                return c && c.responsavel_id===u.id;
            }));
            if (!t) { alert('Nenhuma viagem em andamento para seus filhos.'); return; }
            const r = db.routes.find(x=>x.id===t.route_id);
            const mot = db.drivers.find(d=>d.id===t.driver_id);
            const v = db.vehicles.find(vv=>vv.id===r.vehicle_id);
            const html = `
                <h3>Acompanhamento em tempo real</h3>
                <div class="fake-map" id="tmMap">
                    <span class="label-pin" style="left:12%;top:35%;">Rota</span>
                    <span class="label-pin" style="left:88%;top:65%;">Escola/Casa</span>
                    <div class="pin" id="tmPin" style="left:10%;top:50%;">🚐</div>
                    <div class="float-info">
                        <span><b>Motorista:</b> ${mot?userNome(mot.user_id):'-'} ${v?'('+v.modelo+' - '+v.placa+')':''}</span>

        }
        function animateTm(tid) {
            let p = 0.1;
            const iv = setInterval(()=>{
                p = Math.min(0.9, p+0.05);
                const pin = document.getElementById('tmPin');
                if (pin) { pin.style.left = (p*100)+'%'; pin.style.top = (35+(30*(p/0.9)))+'%'; }
                const eta = document.getElementById('tmEta');
                if (eta) eta.textContent = 'ETA: '+Math.max(1,Math.round((0.9-p)*10))+' min';
                if (p>=0.9) { clearInterval(iv); const st=document.getElementById('tmStatus'); if (st) st.textContent='Chegou ao destino final'; }
            }, 900);
        }

        // ================= MOTORISTA =================
        function motoristaView(u) {
            const drv = db.drivers.find(d=>d.user_id===u.id);
            const rotasDoMotorista = db.routes.filter(r=>r.driver_id===(drv?drv.id:null) && r.ativo);
            const contratosX = db.contracts.filter(c=>c.status==='ativo' && rotasDoMotorista.some(r=>r.id===c.route_id));
            const previsto = contratosX.reduce((s,c)=>s+c.valor_mensal,0);
            let todayTrips = db.trips.filter(t=>rotasDoMotorista.some(r=>r.id===t.route_id) && t.data===hoje());
            if (!todayTrips.length && rotasDoMotorista.length) {
                // gera automaticamente as viagens do dia (ida)
                rotasDoMotorista.forEach(r=>{
                    if (!db.trips.some(t=>t.route_id===r.id && t.data===hoje() && t.tipo==='ida')) {
                        db.trips.push({ id:'t_'+Date.now()+'_'+r.id+'_ida', route_id:r.id, driver_id:r.driver_id, vehicle_id:r.vehicle_id, tipo:'ida', data:hoje(), hora:r.hora_ida, status:'agendado', students: db.enrollments.filter(e=>e.route_id===r.id && e.shift==='ida' && e.ativo).map(e=>({ enrollment_id:e.id, student_id:e.student_id, stop_id:null, status:'aguardando' })) });
                    }
                });
                save();
                todayTrips = db.trips.filter(t=>rotasDoMotorista.some(r=>r.id===t.route_id) && t.data===hoje());
            }
            return `
                <div class="aviso-topo">Ol\u00e1, <b>${u.nome.split(' ')[0]}</b>! Mensalidade prevista no m\u00eas: <b>${money(previsto)}</b></div>
                <h3>Roteiro de hoje (${hoje()})</h3>
                ${todayTrips.length ? todayTrips.map(t=>roteiroTripCard(t)).join('') : '<p>Nenhuma rota ativa vinculada a voc\u00ea.</p>'}
                <hr><button class="btn btn-outline" onclick="logout()">Sair</button>`;
        }
        function roteiroTripCard(t) {
            const r = db.routes.find(x=>x.id===t.route_id);
            return `<div class="item">
                <div class="item-header"><span class="item-name">${t.tipo.toUpperCase()} \u00b7 ${r.nome}</span>${statusBadge(t.status)}</div>
                <div class="item-small">${t.hora||r.hora_id} \u00b7 ${(t.students||[]).length} aluno(s)</div>
                ${t.status==='agendado' ? '<button class="mini-btn mb-add" onclick="iniciarTrip(\''+t.id+'\')">Iniciar viagem (ativa GPS + acompanhamento)</button>' : ''}
                ${t.status==='iniciado' ? '<button class="mini-btn mb-warn" onclick="iniciarTrip(\''+t.id+'\')">Marcar em andamento</button>' : ''}
                ${t.status==='em_andamento' ? '<button class="mini-btn mb-ok" onclick="finalizarTrip(\''+t.id+'\')">Finalizar viagem</button>' : ''}
                ${(t.status==='iniciado'||t.status==='em_andamento') ? '<button class="mini-btn mb-add" onclick="abrirPresenca(\''+t.id+'\')">Lista de presen\u00e7a</button>' : ''}
                <div id="presenca${t.id}"></div>
            </div>`;
        }
        function iniciarTrip(tid) {
            const t = db.trips.find(x=>x.id===tid); if (!t) return;
            if (t.status==='agendado') { t.status='iniciado'; t.iniciado_em=agora(); }
            else if (t.status==='iniciado') { t.status='em_andamento'; }
            db.trip_active = tid; save(); render();
        }
        function finalizarTrip(tid) {
            const t = db.trips.find(x=>x.id===tid); if (!t) return;
            t.status='finalizado'; t.finalizado_em=agora();
            if (db.trip_active===tid) db.trip_active=null;
            save(); alert('Viagem finalizada. GPS desativado.'); render();
        }
        function abrirPresenca(tid) {
            const t = db.trips.find(x=>x.id===tid); if (!t) return;
            const el = document.getElementById('presenca'+tid);
            el.innerHTML = (t.students||[]).map(st=>{
                const aluno = db.students.find(a=>a.id===st.student_id);
                const en = db.enrollments.find(e=>e.id===st.enrollment_id);
                const c = en ? db.contracts.find(cc=>cc.id===en.contract_id) : null;
                const resp = c ? userNome(c.responsavel_id) : '-';
                const stt = st.status==='aguardando' ? 'Presente' : (st.status==='ausente' ? 'Ausente' : st.status);
                return `<div class="item" style="margin-bottom:6px;">
                    <div class="item-header"><span class="item-name">${aluno?aluno.nome:'-'} <span class="badge b-ativo">${stt}</span></span></div>
                    <div class="item-small">Respons\u00e1vel: ${resp} ${c?respTelContato(c):''}</div>
                    ${aluno && aluno.necessidades ? '<div class="item-small" style="color:#dc3545;">'+aluno.necessidades+'</div>':''}
                    <div class="presenca">
                        <button class="mini-btn mb-ok" onclick="marcarPresenca('${tid}','${st.enrollment_id}','embarcado')">Embarque</button>
                        <button class="mini-btn mb-warn" onclick="marcarPresenca('${tid}','${st.enrollment_id}','desembarcado')">Desembarque</button>
                        <button class="mini-btn mb-danger" onclick="marcarPresenca('${tid}','${st.enrollment_id}','ausente')">Ausente</button>
                    </div>
                </div>`;
            }).join('') || '<p>Sem alunos nesta viagem.</p>';
        }
        function respTelC(c) { const r = db.users.find(u=>u.id===c.responsavel_id); return r ? (r.whats||r.telefone_emergencia||'') : ''; }
        function respTelContato(c) { const t = respTelC(c); return '\u00b7 Tel: '+t; }
        function marcarPresenca(tid, enid, status) {
            const t = db.trips.find(x=>x.id===tid); if (!t) return;
            const st = (t.students||[]).find(s=>s.enrollment_id===enid);
            if (st) {
                st.status = status;
                st.marcado_em = agora();
                if (status==='embarcado') st.embarcado_em=agora();
                if (status==='desembarcado') { st.desembarcado_em=agora(); }
            }
            save(); render();
        }

        function geocodeAddr(q) {
            const photon = 'https://photon.komoot.io/api/?limit=1&lang=pt&q='+encodeURIComponent(q);
            const nominatim = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q='+encodeURIComponent(q);
            return fetch(photon).then(r=>r.json()).then(js=>{
                if (js && js.features && js.features[0]) { const co = js.features[0].geometry.coordinates; return [co[0], co[1]]; }
                return fetch(nominatim).then(r=>r.json()).then(a=>{ if (a && a[0]) return [parseFloat(a[0].lon), parseFloat(a[0].lat)]; return null; });
            }).catch(()=> fetch(nominatim).then(r=>r.json()).then(a=>{ if (a && a[0]) return [parseFloat(a[0].lon), parseFloat(a[0].lat)]; return null; }).catch(()=>null));
        }
        function osrmDistance(c1, c2) {
            const coords = c1.join(',')+';'+c2.join(',');
            const servers = [
                'https://router.project-osrm.org/route/v1/driving/'+coords+'?overview=false',
                'https://routing.openstreetmap.de/routed-car/route/v1/driving/'+coords+'?overview=false'
            ];
            const parse = js => (js && js.routes && js.routes[0]) ? js.routes[0].distance : null;
            return fetch(servers[0]).then(r=>r.json()).then(parse).catch(()=>null)
                .then(d => d || fetch(servers[1]).then(r=>r.json()).then(parse).catch(()=>null));
        }
        let _kmTimer = null;
        function autoCalcKm(aId, bId, outId) {
            aId = aId || 'rEmbarque'; bId = bId || 'rEntrega'; outId = outId || 'rKm';
            const aEl = document.getElementById(aId), bEl = document.getElementById(bId);
            if (!aEl || !bEl) return;
            const a = aEl.value.trim(), b = bEl.value.trim();
            if (!a || !b || a.length < 5 || b.length < 5) return;
            if (_kmTimer) clearTimeout(_kmTimer);
            _kmTimer = setTimeout(()=>calcKmRota(true, aId, bId, outId), 800);
        }
        function calcKmRota(silent, aId, bId, outId) {
            aId = aId || 'rEmbarque'; bId = bId || 'rEntrega'; outId = outId || 'rKm';
            if (typeof fetch !== 'function') { if (!silent) alert('Seu navegador n\u00e3o suporta o c\u00e1lculo autom\u00e1tico. Digite o KM manualmente.'); return; }
            const aEl = document.getElementById(aId), bEl = document.getElementById(bId), out = document.getElementById(outId);
            if (!aEl || !bEl || !out) return;
            const a = aEl.value.trim(), b = bEl.value.trim();
            if (!a || !b) { if (!silent) alert('Preencha os endere\u00e7os de embarque e entrega primeiro.'); return; }
            out.placeholder = 'Calculando...';
            Promise.all([geocodeAddr(a), geocodeAddr(b)])
                .then(res => {
                    if (!res[0] || !res[1]) { out.value=''; if (!silent) alert('N\u00e3o foi poss\u00edvel localizar os endere\u00e7os. Digite o KM manualmente.'); return null; }
                    return osrmDistance(res[0], res[1]);
                })
                .then(dist => {
                    if (dist) { out.value = Math.max(1, Math.round(dist/1000*10)/10); out.placeholder=''; }
                    else { out.value=''; if (!silent) alert('N\u00e3o foi poss\u00edvel calcular o percurso. Digite o KM manualmente.'); }
                })
                .catch(()=>{ out.value=''; if (!silent) alert('Sem internet ou servi\u00e7o indispon\u00edvel. Digite o KM manualmente.'); });
        }

        function removerUsuario(uid) {
            const u = db.users.find(x=>x.id===uid); if(!u) return;
            if (u.id === sessao.user_id) { alert('Voc\u00ea n\u00e3o pode remover a si mesmo.'); return; }
            if (u.tipo === 'admin') { alert('A conta administrativa n\u00e3o pode ser removida.'); return; }
            if (!confirm('Remover usu\u00e1rio '+u.nome+'? O contrato, a matr\u00edcula e a rota vinculados tamb\u00e9m ser\u00e3o removidos.')) return;
            const meusAlunos = db.students.filter(s=>s.responsavel_id===uid).map(s=>s.id);
            const meusContratos = db.contracts.filter(c=>c.responsavel_id===uid || meusAlunos.includes(c.student_id));
            const cids = meusContratos.map(c=>c.id);
            const rids = [...new Set(meusContratos.map(c=>c.route_id).filter(Boolean))];
            db.contracts = db.contracts.filter(c=>!cids.includes(c.id));
            db.enrollments = db.enrollments.filter(e=>!cids.includes(e.contract_id) && !meusAlunos.includes(e.student_id));
            db.students = db.students.filter(s=>s.responsavel_id!==uid);
            rids.forEach(rid=>{
                if (!db.contracts.some(c=>c.route_id===rid) && !db.enrollments.some(e=>e.route_id===rid)) {
                    db.route_stops = db.route_stops.filter(p=>p.route_id!==rid);
                    db.routes = db.routes.filter(r=>r.id!==rid);
                }
            });
            if (u.tipo === 'motorista') db.drivers = db.drivers.filter(d=>d.user_id!==uid);
            db.users = db.users.filter(x=>x.id!==uid);
            save(); abaAdmin('usuarios');
        }

        function salvarEdicaoContrato() {
            const c = db.contracts.find(x=>x.id===document.getElementById('ecId').value); if (!c) return;
            const turno = document.getElementById('ecTurno').value;
            const valor = parseFloat(document.getElementById('ecValor').value) || 0;
            const quinzena = document.getElementById('ecQuinzena').value;
            const status = document.getElementById('ecStatus').value;
            c.turno = turno;
            c.valor_mensal = valor;
            c.quinzena = quinzena;
            c.vencimento_dia = (quinzena==='dia20'?20:5);
            c.status = status;
            const pagoEl = document.getElementById('ecPago');
            if (pagoEl) { c.pago = pagoEl.value==='pago'; if (c.pago) c.paid_at = c.paid_at || agora(); }
            const shifts = turno==='ida_volta' ? ['ida','volta'] : [turno];
            db.enrollments.forEach(e=>{ if (e.contract_id===c.id) e.ativo = (status==='ativo'); });
            db.enrollments = db.enrollments.filter(e=>e.contract_id!==c.id || shifts.includes(e.shift));
            if (status==='ativo') shifts.forEach(sh=>{ if (!db.enrollments.some(e=>e.contract_id===c.id && e.shift===sh)) db.enrollments.push({ id:'en_'+Date.now()+sh, contract_id:c.id, route_id:c.route_id, student_id:c.student_id, shift:sh, ativo:true }); });
            save(); alert('Contrato atualizado.'); abaAdmin(document.getElementById('editBoxContrato')?'contratos':'financeiro');
        }

            db.contracts = db.contracts.filter(x=>x.id!==cid);

                <span style="white-space:nowrap;">${money(c.valor_mensal)} ${statusBadge(pago?'pago':'pendente')}
                    ${pago ? `<button class="mini-btn mb-warn" onclick="reabrirReceita('${c.id}')" style="margin-left:6px;">Reabrir</button>`
                           : `<button class="mini-btn mb-ok" onclick="baixarReceita('${c.id}')" style="margin-left:6px;">Pago</button>`}
                    <button class="mini-btn mb-add" onclick="editarContrato('${c.id}')" style="margin-left:6px;">Editar</button>
                </span></div>`;
        }
        function despLinha(e) {
            const pend = e.status !== 'pago';
            return `<div class="resumo-item">
                <span>${e.descricao} <span class="exp-cat">\u00b7 ${e.categoria||'Outros'} \u00b7 ${e.data||''}</span></span>
                <span style="white-space:nowrap;">${money(e.valor)} ${statusBadge(pend?'pendente':'pago')}
                    ${pend ? `<button class="mini-btn mb-ok" onclick="baixarDespesa('${e.id}')" style="margin-left:6px;">Pagar</button>`
                           : `<button class="mini-btn mb-warn" onclick="reabrirDespesa('${e.id}')" style="margin-left:6px;">Reabrir</button>`}
                    <button class="mini-btn mb-add" onclick="editarDespesa('${e.id}')" style="margin-left:6px;">Editar</button>
                    <button class="mini-btn mb-danger" onclick="removerDespesa('${e.id}')" style="margin-left:4px;">x</button>
                </span></div>`;
        }
        function revLinha(r) {
            const pend = r.status !== 'pago';
            return `<div class="resumo-item">
                <span>${r.descricao} <span class="exp-cat">\u00b7 manual \u00b7 ${r.data||''}</span></span>
                <span style="white-space:nowrap;">${money(r.valor)} ${statusBadge(pend?'pendente':'pago')}
                    ${pend ? `<button class="mini-btn mb-ok" onclick="baixarRev('${r.id}')" style="margin-left:6px;">Receber</button>`
                           : `<button class="mini-btn mb-warn" onclick="reabrirRev('${r.id}')" style="margin-left:6px;">Reabrir</button>`}
                    <button class="mini-btn mb-add" onclick="editarReceitaManual('${r.id}')" style="margin-left:6px;">Editar</button>
                    <button class="mini-btn mb-danger" onclick="removerRev('${r.id}')" style="margin-left:4px;">x</button>
                </span></div>`;
        }
        function quinzenaBloco(titulo, q) {
            const recs = db.contracts.filter(c=>contractQuinzena(c)===q);
            const revs = (db.revenues||[]).filter(r=>(r.quinzena||'dia5')===q);
            const desps = (db.expenses||[]).filter(e=>(e.quinzena||'dia5')===q);
            const recTotal = recs.reduce((s,c)=>s+Number(c.valor_mensal||0),0) + revs.reduce((s,r)=>s+Number(r.valor||0),0);
            const recReceb = recs.filter(c=>c.pago).reduce((s,c)=>s+Number(c.valor_mensal||0),0) + revs.filter(r=>r.status==='pago').reduce((s,r)=>s+Number(r.valor||0),0);
            const despTotal = desps.reduce((s,e)=>s+Number(e.valor||0),0);
            const despPago = desps.filter(e=>e.status==='pago').reduce((s,e)=>s+Number(e.valor||0),0);
            const saldo = recReceb - despPago;
            return `
                <div class="quinzena-title">${titulo}</div>
                <div class="item" style="border-left:4px solid var(--success-green);">
                    <div style="font-weight:bold;color:var(--success-green);margin-bottom:6px;">\ud83d\udcb0 Receitas</div>
                    ${(recs.length || revs.length) ? (recs.map(recLinha).join('') + revs.map(revLinha).join('')) : '<p class="empty-msg">Nenhuma receita.</p>'}
                    <div class="resumo-item" style="font-weight:bold;border-top:1px solid #ddd;padding-top:8px;">
                        <span>Total da quinzena</span><span style="color:var(--success-green);">${money(recTotal)}</span></div>
                </div>
                <div class="item" style="border-left:4px solid var(--danger-red);">
                    <div style="font-weight:bold;color:var(--danger-red);margin-bottom:6px;">\ud83d\udccb Despesas</div>
                    ${desps.length ? desps.map(despLinha).join('') : '<p class="empty-msg">Nenhuma despesa.</p>'}
                    <div class="resumo-item" style="font-weight:bold;border-top:1px solid #ddd;padding-top:8px;">
                        <span>Total da quinzena</span><span style="color:var(--danger-red);">${money(despTotal)}</span></div>
                </div>
                <div class="fin-hero" style="background:${saldo>=0?'var(--success-green)':'var(--danger-red)'};">
                    <h3>${money(saldo)}</h3><p>Saldo da quinzena (recebido - pago)</p></div>
            `;
        }
        function adminFinanceiro() {
            db.expenses = db.expenses || [];
            db.revenues = db.revenues || [];
            const contratos = db.contracts;
            const recContrReceb = contratos.filter(c=>c.pago).reduce((s,c)=>s+Number(c.valor_mensal||0),0);
            const recContrPend = contratos.filter(c=>!c.pago && c.status!=='cancelado').reduce((s,c)=>s+Number(c.valor_mensal||0),0);
            const revReceb = db.revenues.filter(r=>r.status==='pago').reduce((s,r)=>s+Number(r.valor||0),0);
            const revPend = db.revenues.filter(r=>r.status!=='pago').reduce((s,r)=>s+Number(r.valor||0),0);
            const recReceb = recContrReceb + revReceb;
            const recPend = recContrPend + revPend;
            const despPago = db.expenses.filter(e=>e.status==='pago').reduce((s,e)=>s+Number(e.valor||0),0);
            const despPend = db.expenses.filter(e=>e.status!=='pago').reduce((s,e)=>s+Number(e.valor||0),0);
            const saldo = recReceb - despPago;
            const saldoPrev = (recReceb+recPend) - (despPago+despPend);
            const catOpts = CAT_DESPESA.map(c=>`<option value="${c}">${c}</option>`).join('');
            return `
                <div id="editBoxFin"></div>
                <div class="fin-hero" style="background:${saldo>=0?'var(--success-green)':'var(--danger-red)'};">
                    <h3>${money(saldo)}</h3><p>Saldo realizado (recebido - despesas pagas)</p></div>
                <div class="fin-grid">
                    <div class="fin-card"><div class="t">Receitas recebidas</div><div class="v g">${money(recReceb)}</div></div>
                    <div class="fin-card"><div class="t">Receitas a receber</div><div class="v o">${money(recPend)}</div></div>
                    <div class="fin-card"><div class="t">Despesas pagas</div><div class="v r">${money(despPago)}</div></div>
                    <div class="fin-card"><div class="t">Despesas a pagar</div><div class="v r">${money(despPend)}</div></div>
                </div>
                <div class="fin-card" style="margin-bottom:12px;"><div class="t">Saldo previsto (tudo)</div><div class="v" style="color:#0056b3;">${money(saldoPrev)}</div></div>

                <div class="quinzena-title">\u2795 Incluir receita</div>
                <div class="item" style="border-style:dashed;">
                    <div class="form-group"><label>Descri\u00e7\u00e3o</label><input id="reDesc" placeholder="Ex: Mensalidade avulsa, venda, reembolso..."></div>
                    <div class="grid2">
                        <div class="form-group"><label>Valor (R$)</label><input id="reValor" type="number" min="0" step="0.01" placeholder="0,00"></div>
                        <div class="form-group"><label>Data</label><input id="reData" type="date" value="${hoje()}"></div>
                    </div>
                    <div class="grid2">
                        <div class="form-group"><label>Quinzena</label><select id="reQuinzena"><option value="dia5">Dia 5 (1\u00aa Quinzena)</option><option value="dia20">Dia 20 (2\u00aa Quinzena)</option></select></div>
                        <div class="form-group"><label>Situa\u00e7\u00e3o</label><select id="reStatus"><option value="pago">Recebido</option><option value="pendente">A receber</option></select></div>
                    </div>
                    <button class="btn btn-success" onclick="adicionarReceita()">Incluir receita</button>
                </div>

                <div class="quinzena-title">\u2795 Incluir despesa</div>
                <div class="item" style="border-style:dashed;">
                    <div class="form-group"><label>Descri\u00e7\u00e3o</label><input id="exDesc" placeholder="Ex: Combust\u00edvel da van"></div>
                    <div class="grid2">
                        <div class="form-group"><label>Categoria</label><select id="exCat">${catOpts}</select></div>
                        <div class="form-group"><label>Valor (R$)</label><input id="exValor" type="number" min="0" step="0.01" placeholder="0,00"></div>
                    </div>
                    <div class="grid2">
                        <div class="form-group"><label>Data</label><input id="exData" type="date" value="${hoje()}"></div>
                        <div class="form-group"><label>Quinzena</label><select id="exQuinzena"><option value="dia5">Dia 5 (1\u00aa Quinzena)</option><option value="dia20">Dia 20 (2\u00aa Quinzena)</option></select></div>
                    </div>
                    <div class="form-group"><label>Situa\u00e7\u00e3o</label><select id="exStatus"><option value="pendente">A pagar</option><option value="pago">J\u00e1 pago</option></select></div>
                    <button class="btn btn-add" onclick="adicionarDespesa()">Incluir despesa</button>
                </div>

                ${quinzenaBloco('\ud83d\udcc5 1\u00aa Quinzena (Dia 5)', 'dia5')}
                ${quinzenaBloco('\ud83d\udcc5 2\u00aa Quinzena (Dia 20)', 'dia20')}

                <div class="quinzena-title">\ud83e\uddfe Resumo geral (receitas - despesas)</div>
                <div class="item">
                    <div class="resumo-item"><span>Total de receitas</span><span style="color:var(--success-green);font-weight:bold;">${money(recReceb+recPend)}</span></div>
                    <div class="resumo-item"><span>Total de despesas</span><span style="color:var(--danger-red);font-weight:bold;">${money(despPago+despPend)}</span></div>
                    <div class="resumo-item" style="font-weight:bold;border-top:1px solid #ddd;padding-top:8px;">
                        <span>Saldo (receitas - despesas)</span>
                        <span style="color:${saldoPrev>=0?'var(--success-green)':'var(--danger-red)'};">${money(saldoPrev)}</span></div>
                </div>
            `;
        }
        function adicionarDespesa() {
            const desc = document.getElementById('exDesc').value.trim();
            const valor = parseFloat(document.getElementById('exValor').value) || 0;
            if (!desc || valor <= 0) { alert('Informe a descri\u00e7\u00e3o e o valor da despesa.'); return; }
            db.expenses.push({
                id:'x_'+Date.now(), descricao:desc,
                categoria:document.getElementById('exCat').value,
                valor,
                data:document.getElementById('exData').value || hoje(),
                quinzena:document.getElementById('exQuinzena').value,
                status:document.getElementById('exStatus').value,
                created_at:agora()
            });
            save(); abaAdmin('financeiro');
        }
        function baixarDespesa(id) {
            const e = db.expenses.find(x=>x.id===id); if (!e) return;
            e.status='pago'; e.pago_em=agora(); save(); abaAdmin('financeiro');
        }
        function reabrirDespesa(id) {
            const e = db.expenses.find(x=>x.id===id); if (!e) return;
            e.status='pendente'; delete e.pago_em; save(); abaAdmin('financeiro');
        }
        function removerDespesa(id) {
            if (!confirm('Remover esta despesa?')) return;
            db.expenses = db.expenses.filter(x=>x.id!==id); save(); abaAdmin('financeiro');
        }
        function baixarReceita(cid) {
            const c = db.contracts.find(x=>x.id===cid); if (!c) return;
            c.status='ativo'; c.pago=true; c.paid_at=agora(); c.data_ativacao=c.data_ativacao||agora();
            const shifts = c.turno==='ida_volta' ? ['ida','volta'] : [c.turno];
            shifts.forEach(sh => { if (!db.enrollments.some(e=>e.contract_id===cid && e.shift===sh)) db.enrollments.push({ id:'en_'+Date.now()+sh, contract_id:cid, route_id:c.route_id, student_id:c.student_id, shift:sh, ativo:true }); });
            save(); abaAdmin('financeiro');
        }
        function reabrirReceita(cid) {
            const c = db.contracts.find(x=>x.id===cid); if (!c) return;
            c.pago=false; delete c.paid_at; save(); abaAdmin('financeiro');
        }
        function editarDespesa(id) {
            const e = db.expenses.find(x=>x.id===id); if(!e) return;
            const box = document.getElementById('editBoxFin'); if(!box) return;
            const catOpts = CAT_DESPESA.map(c=>`<option value="${c}" ${e.categoria===c?'selected':''}>${c}</option>`).join('');
            box.innerHTML = `
                <h3>Editar despesa</h3>
                <div class="item" style="border:2px solid #0056b3;">
                    <input type="hidden" id="edxId" value="${e.id}">
                    <div class="form-group"><label>Descri\u00e7\u00e3o</label><input id="edxDesc" value="${e.descricao||''}"></div>
                    <div class="grid2">
                        <div class="form-group"><label>Categoria</label><select id="edxCat">${catOpts}</select></div>
                        <div class="form-group"><label>Valor (R$)</label><input id="edxValor" type="number" min="0" step="0.01" value="${e.valor}"></div>
                    </div>
                    <div class="grid2">
                        <div class="form-group"><label>Data</label><input id="edxData" type="date" value="${e.data||''}"></div>
                        <div class="form-group"><label>Quinzena</label><select id="edxQuinzena">
                            <option value="dia5" ${(e.quinzena||'dia5')==='dia5'?'selected':''}>Dia 5 (1\u00aa Quinzena)</option>
                            <option value="dia20" ${e.quinzena==='dia20'?'selected':''}>Dia 20 (2\u00aa Quinzena)</option></select></div>
                    </div>
                    <div class="form-group"><label>Situa\u00e7\u00e3o</label><select id="edxStatus">
                        <option value="pendente" ${e.status!=='pago'?'selected':''}>A pagar</option>
                        <option value="pago" ${e.status==='pago'?'selected':''}>Pago</option></select></div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <button class="btn btn-add" onclick="salvarEdicaoDespesa()">Salvar</button>
                        <button class="btn btn-outline" onclick="document.getElementById('editBoxFin').innerHTML=''">Cancelar</button>
                    </div>
                </div>`;
            if (box.scrollIntoView) box.scrollIntoView({behavior:'smooth'});
        }
        function salvarEdicaoDespesa() {
            const e = db.expenses.find(x=>x.id===document.getElementById('edxId').value); if(!e) return;
            e.descricao = document.getElementById('edxDesc').value.trim() || e.descricao;
            e.categoria = document.getElementById('edxCat').value;
            e.valor = parseFloat(document.getElementById('edxValor').value) || 0;
            e.data = document.getElementById('edxData').value || e.data;
            e.quinzena = document.getElementById('edxQuinzena').value;
            e.status = document.getElementById('edxStatus').value;
            save(); alert('Despesa atualizada.'); abaAdmin('financeiro');
        }
        function editarReceitaManual(id) {
            const r = db.revenues.find(x=>x.id===id); if(!r) return;
            const box = document.getElementById('editBoxFin'); if(!box) return;
            box.innerHTML = `
                <h3>Editar receita</h3>
                <div class="item" style="border:2px solid #0056b3;">
                    <input type="hidden" id="edrId" value="${r.id}">
                    <div class="form-group"><label>Descri\u00e7\u00e3o</label><input id="edrDesc" value="${r.descricao||''}"></div>
                    <div class="grid2">
                        <div class="form-group"><label>Valor (R$)</label><input id="edrValor" type="number" min="0" step="0.01" value="${r.valor}"></div>
                        <div class="form-group"><label>Data</label><input id="edrData" type="date" value="${r.data||''}"></div>
                    </div>
                    <div class="grid2">
                        <div class="form-group"><label>Quinzena</label><select id="edrQuinzena">
                            <option value="dia5" ${(r.quinzena||'dia5')==='dia5'?'selected':''}>Dia 5 (1\u00aa Quinzena)</option>
                            <option value="dia20" ${r.quinzena==='dia20'?'selected':''}>Dia 20 (2\u00aa Quinzena)</option></select></div>
                        <div class="form-group"><label>Situa\u00e7\u00e3o</label><select id="edrStatus">
                            <option value="pago" ${r.status==='pago'?'selected':''}>Recebido</option>
                            <option value="pendente" ${r.status!=='pago'?'selected':''}>A receber</option></select></div>
                    </div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <button class="btn btn-add" onclick="salvarEdicaoReceitaManual()">Salvar</button>
                        <button class="btn btn-outline" onclick="document.getElementById('editBoxFin').innerHTML=''">Cancelar</button>
                    </div>
                </div>`;
            if (box.scrollIntoView) box.scrollIntoView({behavior:'smooth'});
        }
        function salvarEdicaoReceitaManual() {
            const r = db.revenues.find(x=>x.id===document.getElementById('edrId').value); if(!r) return;
            r.descricao = document.getElementById('edrDesc').value.trim() || r.descricao;
            r.valor = parseFloat(document.getElementById('edrValor').value) || 0;
            r.data = document.getElementById('edrData').value || r.data;
            r.quinzena = document.getElementById('edrQuinzena').value;
            r.status = document.getElementById('edrStatus').value;
            save(); alert('Receita atualizada.'); abaAdmin('financeiro');
        }
        function adicionarReceita() {
            db.revenues = db.revenues || [];
            const desc = document.getElementById('reDesc').value.trim();
            const valor = parseFloat(document.getElementById('reValor').value) || 0;
            if (!desc || valor <= 0) { alert('Informe a descri\u00e7\u00e3o e o valor da receita.'); return; }
            db.revenues.push({
                id:'r_'+Date.now(), descricao:desc,
                valor,
                data:document.getElementById('reData').value || hoje(),
                quinzena:document.getElementById('reQuinzena').value,
                status:document.getElementById('reStatus').value,
                created_at:agora()
            });
            save(); abaAdmin('financeiro');
        }
        function baixarRev(id) {
            const r = db.revenues.find(x=>x.id===id); if (!r) return;
            r.status='pago'; r.recebido_em=agora(); save(); abaAdmin('financeiro');
        }
        function reabrirRev(id) {
            const r = db.revenues.find(x=>x.id===id); if (!r) return;
            r.status='pendente'; delete r.recebido_em; save(); abaAdmin('financeiro');
        }
        function removerRev(id) {
            if (!confirm('Remover esta receita?')) return;
            db.revenues = db.revenues.filter(x=>x.id!==id); save(); abaAdmin('financeiro');
        }

        // ================= RENDER =================
        function render() {
            const app = document.getElementById('app');
            const u = userAtual();
            const hd = document.getElementById('headerUser');
            if (!u) { hd.textContent=''; app.innerHTML = loginView(); return; }
            hd.textContent = 'Conectado: '+u.nome+' ('+(u.tipo==='admin'?'Administrativo':u.tipo)+')';
            if (u.status !== 'aprovado') {
                app.innerHTML = `<div class="notice"><b>Seu cadastro est\u00e1 em an\u00e1lise.</b><br>Status: ${statusBadge('pendente')}<br>Voc\u00ea ser\u00e1 avisado por WhatsApp/e-mail quando aprovado.</div><button class="btn btn-outline" onclick="logout()">Sair</button>`;
                return;
            }
            if (u.tipo === 'admin') app.innerHTML = adminView(u);
            else if (u.tipo === 'motorista') app.innerHTML = motoristaView(u);
            else app.innerHTML = responsavelView(u);
        }

        // ================= PROTE\u00c7\u00c3O POR PIN (igual ao Control) =================
        const PIN_KEY = 'tiamiraPIN';
        function getPin() { return localStorage.getItem(PIN_KEY); }
        function pinDefinido() { return !!getPin(); }

        function initPin() {
            if (pinDefinido()) {
                const overlay = document.getElementById('pinOverlay');
                overlay.style.display = 'flex';
                setTimeout(function () { document.getElementById('pinInput').focus(); }, 50);
            }
        }

        function verificarPin() {
            const valor = document.getElementById('pinInput').value.trim();
            if (valor === getPin()) {
                document.getElementById('pinErro').textContent = '';
                document.getElementById('pinInput').value = '';
                document.getElementById('pinOverlay').style.display = 'none';
            } else {
                document.getElementById('pinErro').textContent = 'PIN incorreto. Tente novamente.';
                document.getElementById('pinInput').value = '';
            }
        }

        function definirPin() {
            const valor = document.getElementById('pinConfig').value.trim();
            if (!/^\d{4}$/.test(valor)) {
                alert('O PIN deve ter exatamente 4 d\u00edgitos.');
                return;
            }
            localStorage.setItem(PIN_KEY, valor);
            document.getElementById('pinConfig').value = '';
            alert('PIN definido com sucesso!');
        }

        function removerPin() {
            if (!pinDefinido()) { alert('Nenhum PIN definido.'); return; }
            if (!confirm('Remover a prote\u00e7\u00e3o por PIN?')) return;
            localStorage.removeItem(PIN_KEY);
            document.getElementById('pinConfig').value = '';
            alert('PIN removido.');
        }

        render();
        initPin();
    </script>
</body>
</html>
